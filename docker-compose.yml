# Throwaway Postgres for integration tests. Never point tests at Neon.
services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: training_log_test
    ports:
      - "5433:5432" # 5433 so it won't clash with a local Postgres on 5432
    # Data lives in memory: fast, and gone when the container stops.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d training_log_test"]
      interval: 1s
      timeout: 3s
      retries: 30
